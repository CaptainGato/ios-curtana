name: mesa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/mesa/**'
      - 'tools/mk-curtana-mesa.sh'
      - '.github/workflows/mesa.yml'

concurrency:
  group: mesa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build bison flex clang lld llvm

      - name: Setup iOS SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git theos-sdks
          cd theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "IOS_SDK=$PWD/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install mako pyyaml packaging

      - name: Build Mesa Freedreno & Metal AIR
        run: |
          chmod +x tools/mk-curtana-mesa.sh
          bash tools/mk-curtana-mesa.sh

      - name: Verify build outputs
        run: |
          ls -la build/mesa/out/
          file build/mesa/out/*

      - name: Upload Mesa & Metal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curtana-mesa-metal-linux
          path: build/mesa/out/
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install meson ninja bison flex llvm coreutils
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Setup iOS SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git theos-sdks
          cd theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "IOS_SDK=$PWD/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          pip install mako pyyaml packaging

      - name: Build Mesa Freedreno & Metal AIR
        run: |
          chmod +x tools/mk-curtana-mesa.sh
          bash tools/mk-curtana-mesa.sh

      - name: Verify build outputs
        run: |
          ls -la build/mesa/out/
          file build/mesa/out/*

      - name: Upload Mesa & Metal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curtana-mesa-metal-mac
          path: build/mesa/out/
          if-no-files-found: error
